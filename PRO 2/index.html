<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Template Three</title>
    <!-- Main Template CSS File -->
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <div class="nav">
                <ul>
                    <li>Home</li>
                    <li>About</li>
                    <li>Services</li>
                    <li>Contact</li>
                </ul>
            </div>
            <div class="ser">
                <input type="text" placeholder="Search...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>
    </div>
    <!-- contant -->
     <div class="contant">
        <div class="container">
            <div class="all">

                <div class="txt">
                    <div class="login">
                        <i class="fa-solid fa-wind"></i>
                        <h2>Login</h2>
                    </div>
                    <h3>Welcome!</h3>
                    <h4>To Our New Website.</h4>
                    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Eaque, repellendus eligendi.</p>
                    <div class="ico">
                        <i class="fa-brands fa-twitter"></i>
                        <i class="fa-brands fa-linkedin"></i>
                        <i class="fa-brands fa-instagram"></i>
                        <i class="fa-brands fa-facebook"></i>
                    </div>
                </div>

                <div class="sign-in">
                    <div class="frm">
                        <form action="#">
                            <h2>Sign In</h2>

                            <div class="in-box">
                                    <input id="eml" type="email" required autocomplete="off">
                                    <label for="eml">Email</label>
                                    <span class="ico"><i class="fa-solid fa-envelope"></i></span>
                            </div>
                            <div class="in-box">
                                    <input id="pas" type="password" required>
                                    <label for="pas">Password</label>
                                    <span class="ico"><i class="fa-solid fa-lock"></i></span>
                            </div>
                            <div class="rem-for">
                                <label for="check">
                                    <input type="checkbox" id="check">
                                    Remember me
                                </label>
                                <a href="#">Forgot password?</a>
                            </div>

                            <button class="btn">Sign In</button>

                            <div class="sign-up">
                                <p>Don't have an account? <a href="#" class="reg-link">Sign up</a></p>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
     </div>
</body>
</html>
